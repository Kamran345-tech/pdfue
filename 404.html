<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found · PDFUE</title>
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0b14;
    --card:rgba(255,255,255,0.045);
    --border:rgba(255,255,255,0.09);
    --text:#f4f5fb;
    --muted:#9498b3;
    --violet:#2457FF;
    --cyan:#C8FF3D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  body::before, body::after{
    content:"";
    position:fixed;
    width:560px;height:560px;
    border-radius:50%;
    filter:blur(120px);
    opacity:.3;
    pointer-events:none;
  }
  body::before{ top:-200px; left:-160px; background:radial-gradient(circle, var(--violet) 0%, transparent 70%); }
  body::after{ bottom:-220px; right:-160px; background:radial-gradient(circle, var(--cyan) 0%, transparent 70%); }
  .box{position:relative;z-index:1;padding:20px;}
  .code{
    font-family:'Sora',sans-serif;font-weight:800;font-size:96px;
    background:linear-gradient(100deg, var(--violet), var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin:0;
  }
  h1{font-family:'Sora',sans-serif;font-size:24px;margin:6px 0 10px;}
  p{color:var(--muted);font-size:15px;max-width:420px;margin:0 auto 26px;}
  a.home-btn{
    font-family:'Sora',sans-serif;font-weight:600;font-size:14px;
    background:var(--card);border:1px solid var(--border);color:var(--text);
    padding:11px 24px;border-radius:12px;text-decoration:none;display:inline-block;
  }
</style>
</head>
<body>
  <div class="box">
    <p class="code">404</p>
    <h1>This page wandered off</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back to the tools.</p>
    <a class="home-btn" href="/">&larr; Back to PDFUE</a>
  </div>
</body>
</html>
