/* ============================================================
   PDFUE shared theme — purple/violet, light + dark mode
   Used by every page on the site (homepage, tool pages, blog).
   ============================================================ */

:root{
  /* new-design variable names */
  --bg:#ffffff;
  --soft:#f8f7ff;
  --soft2:#f1efff;
  --ink:#1c2047;
  --muted:#697294;
  --line:#e6e9f6;
  --purple:#7047f7;
  --purple2:#8c6bff;
  --shadow:0 18px 48px rgba(84,61,170,.13);
  --card:#ffffff;
  --nav:rgba(255,255,255,.86);

  /* legacy tool-page variable names, mapped onto the same palette
     so every existing tool page picks up the new theme automatically */
  --card-hover:rgba(112,71,247,.07);
  --border:rgba(28,32,71,.10);
  --border-hover:rgba(112,71,247,.35);
  --text:#1c2047;
  --accent:#7047f7;
  --accent-soft:rgba(112,71,247,.12);
  --accent-glow:rgba(112,71,247,.45);
  --violet:#7047f7;
  --cobalt:#2f6bff;
  --lime:#17ad82;
  --cyan:#0aaf9c;
  --pink:#e74b9a;
  --green:#17ad82;
  --red:#e5484d;
  --success:#17ad82;
  --radius:16px;
}
body.dark{
  --bg:#111226;--soft:#191a32;--soft2:#222044;--ink:#f4f2ff;--muted:#b1b4d2;
  --line:#2c2d4c;--card:#191a32;--nav:rgba(17,18,38,.88);
  --shadow:0 12px 34px rgba(0,0,0,.18);

  --card-hover:rgba(255,255,255,.075);
  --border:rgba(255,255,255,.09);
  --border-hover:rgba(255,255,255,.18);
  --text:#f4f2ff;
  --accent:#8c6bff;
  --accent-soft:rgba(140,107,255,.18);
  --accent-glow:rgba(140,107,255,.55);
  --violet:#8c6bff;
  --cobalt:#5c8dff;
  --lime:#34d399;
  --cyan:#2dd4bf;
  --pink:#f472b6;
  --green:#34d399;
  --red:#f87171;
  --success:#34d399;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.012em;transition:background .2s,color .2s}
a{color:inherit}
button,input{font:inherit}
button{cursor:pointer}
::selection{background:var(--purple);color:#fff}

/* ---------- topbar / nav (shared on every page) ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--nav);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.nav{height:72px;display:flex;align-items:center;gap:32px}
.wrap{width:min(1180px,calc(100% - 48px));margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:'Sora',Inter,sans-serif;font-size:22px;font-weight:800;letter-spacing:-.04em;margin-right:auto;text-decoration:none;color:var(--ink)}
.brandmark{width:37px;height:37px;border-radius:12px;background:linear-gradient(145deg,#9678ff,#603bfa);display:grid;place-items:center;color:#fff;box-shadow:0 6px 15px rgba(112,71,247,.35);flex:none}
.brandmark svg{width:21px}
.navlinks{display:flex;gap:27px;align-items:center;font-size:13px;color:var(--muted)}
.navlinks a{text-decoration:none}
.navlinks a:hover,.navlinks a.active{color:var(--purple)}
.navright{display:flex;gap:10px;align-items:center;margin-left:12px}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;display:grid;place-items:center}
.primary{border:0;background:linear-gradient(135deg,var(--purple),#835aff);color:#fff;border-radius:13px;padding:12px 18px;font-size:13px;font-weight:750;box-shadow:0 7px 18px rgba(112,71,247,.3);transition:.2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(112,71,247,.45)}
.secondary{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 14px;font-size:12px;font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.menu{display:none}

/* ---------- generic page header for tool/blog pages ---------- */
.pagehead{position:relative;padding:48px 0 10px;background:
  radial-gradient(ellipse at 82% 10%,rgba(158,123,255,.22),transparent 32%),
  radial-gradient(ellipse at 6% 0%,rgba(255,206,240,.28),transparent 28%),
  linear-gradient(180deg,var(--soft) 0%,var(--bg) 100%)}
.pagehead .crumb{font-size:12px;color:var(--muted);margin-bottom:14px;display:flex;gap:6px;align-items:center}
.pagehead .crumb a{color:var(--muted);text-decoration:none}
.pagehead .crumb a:hover{color:var(--purple)}

/* ---------- footer (shared on every page) ---------- */
.footer{background:linear-gradient(135deg,#211448,#342064);color:#fff;padding:40px 0 20px;margin-top:40px}
.footergrid{display:grid;grid-template-columns:1.3fr .8fr .9fr 1.3fr;gap:38px}
.footer .brand{font-size:21px;color:#fff}
.footer .brandmark{width:33px;height:33px}

:root{--aurora1:rgba(124,92,255,.22);--aurora2:rgba(232,92,190,.16);--aurora3:rgba(56,189,248,.14);--glow:0 18px 50px -12px rgba(112,71,247,.45)}

/* animated aurora behind every page */
html::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:
   radial-gradient(40% 35% at 12% 8%,var(--aurora1),transparent 70%),

@keyframes aurora{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(2%,3%,0) scale(1.06)}100%{transform:translate3d(-3%,-2%,0) scale(1.03)}}

/* same container width on every page for topbar + footer */
.topbar .nav,.footer .footergrid,.footer .copyright{width:min(1180px,calc(100% - 48px));max-width:none;margin-left:auto;margin-right:auto;padding-left:0;padding-right:0}

<body>
<div class="box">
<p class="code">404</p>
<h1>This page wandered off</h1>
<p>The page you're looking for doesn't exist or may have moved. Let's get you back to the tools.</p>
<div><a class="primary" href="/">&larr; Back to PDFUE</a></div>

<script>
/* PDFUE shared site behaviour: dark/light toggle, active-nav highlight,
   mobile menu stub, footer year. No external calls, no eval, no innerHTML
   of untrusted data — safe to include on every page. */
(function(){
  "use strict";

  // Restore saved theme before paint-relevant work (called at end of <head>
  // or top of <body> by pages that include this script with `defer`, so DOM
  // exists; dark class on <body> is applied as soon as this runs).
  function applySavedTheme(){
    try{
      if(localStorage.getItem('pdfue-theme') === 'dark'){
        document.body.classList.add('dark');
      }
    }catch(e){ /* storage may be blocked — fall back to light theme */ }
  }

  function wireThemeToggle(){
    var btn = document.getElementById('themeToggle');
    if(!btn) return;
    btn.addEventListener('click', function(){
      document.body.classList.toggle('dark');
      try{
        localStorage.setItem('pdfue-theme', document.body.classList.contains('dark') ? 'dark' : 'light');
      }catch(e){}
    });
  }

  function markActiveNav(){
    var norm = function(p){ return p.replace(/\/$/, '/index.html'); };
    var here = norm(location.pathname);
    document.querySelectorAll('.navlinks a[href]').forEach(function(a){
      if(norm(a.pathname) === here && (!a.hash || a.hash === '#home')) a.classList.add('active');
    });
  }

  function wireMenuBtn(){
    var btn = document.getElementById('menuBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      var links = document.querySelector('.navlinks');
      if(links) links.classList.toggle('mobile-open');
    });
  }

  function setYear(){
    var y = document.getElementById('year');
    if(y) y.textContent = new Date().getFullYear();
  }

  var toastTimer;
  function toast(msg){
    var t = document.getElementById('toast');
    if(!t) return;
    t.textContent = String(msg); // textContent only — never innerHTML of user/dynamic text
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
  window.PDFUEToast = toast;

  function wireNewsletter(){
    var form = document.getElementById('newsletterForm');
    if(!form) return;
    form.addEventListener('submit', function(e){
      e.preventDefault();
      toast('Thanks! Newsletter signup form is a visual demo on this static site — connect a mailing-list provider to enable it.');
      form.reset();
    });
  }

  function ready(fn){
    if(document.readyState !== 'loading') fn();
    else document.addEventListener('DOMContentLoaded', fn);
  }

  applySavedTheme();
  ready(function(){
    wireThemeToggle();
    markActiveNav();
    wireMenuBtn();
    setYear();
    wireNewsletter();
  });
})();

</script>
</body>
